name: Backend validation
on:
  push:
    branches: [develop, preprod, main]
    paths: ['backend/**', '.github/workflows/backend-ci.yml']
  pull_request:
    branches: [develop, preprod, main]
    paths: ['backend/**', '.github/workflows/backend-ci.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m compileall -q backend
      - run: python -m unittest discover -s backend/tests -p test_package13_cost.py
      - run: docker build -t ai103-backend:ci backend
      - run: docker run --rm --entrypoint python ai103-backend:ci -m compileall -q /app
