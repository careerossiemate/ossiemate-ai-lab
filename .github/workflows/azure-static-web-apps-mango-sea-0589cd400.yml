name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - develop

  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - develop

  workflow_dispatch:

permissions:
  contents: read

jobs:

  build_and_deploy_job:

    if: github.event_name != 'pull_request' || github.event.action != 'closed'

    runs-on: ubuntu-latest

    name: Build and Deploy Frontend

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify Build Environment
        run: |
          node --version
          npm --version

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Save Dependency Lockfile
        uses: actions/upload-artifact@v4
        with:
          name: frontend-package-lock
          path: frontend/package-lock.json
          retention-days: 7
          if-no-files-found: error

      - name: Build Authentication Bundle
        working-directory: frontend
        run: npm run build

      - name: Prepare Deployment Directory
        run: |
          mkdir -p frontend-deploy/js/dist

          cp frontend/index.html frontend-deploy/

          cp -r frontend/css frontend-deploy/

          cp -r frontend/assets frontend-deploy/

          cp -r frontend/pages frontend-deploy/

          cp frontend/js/dist/auth.bundle.js \
            frontend-deploy/js/dist/

          if [ -f frontend/staticwebapp.config.json ]; then
            cp frontend/staticwebapp.config.json frontend-deploy/
          fi

      - name: Validate Deployment Files
        run: |
          test -s frontend-deploy/index.html

          test -s frontend-deploy/css/style.css

          test -s frontend-deploy/js/dist/auth.bundle.js

          for exercise in 03 04 05 06; do
            test -s "frontend-deploy/pages/exercise${exercise}.html"
          done

          echo "All required deployment files are available."

          find frontend-deploy -type f

          du -h frontend-deploy/js/dist/auth.bundle.js

      - name: Deploy to Azure Static Web Apps
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_MANGO_SEA_0589CD400 }}
          action: "upload"
          app_location: "./frontend-deploy"
          api_location: ""
          output_location: ""
          skip_app_build: true

  close_pull_request_job:

    if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository

    runs-on: ubuntu-latest

    name: Close Pull Request Environment

    steps:

      - name: Close Pull Request
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_MANGO_SEA_0589CD400 }}
          action: "close"
